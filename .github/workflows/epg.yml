name: Actualitza EPG 3Cat

on:
  schedule:
    - cron: "0 4 * * *"   # Cada dia a les 04:00 UTC (06:00 CEST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: pip install -r requirements.txt

      - name: Executa l'scraper
        run: python scraper.py

      - name: Puja el fitxer XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/epg.xml
          if git diff --staged --quiet; then
            echo "Sense canvis, no cal commit."
          else
            git commit -m "Actualització EPG $(date -u +'%Y-%m-%d %H:%M')"
            git push origin HEAD:${{ github.ref_name }}
          fi
