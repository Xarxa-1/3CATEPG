name: Actualitza EPG TV3Cat

on:
  schedule:
    - cron: "0 4 * * *"   # Cada dia a les 04:00 UTC
  workflow_dispatch:      # També es pot llançar manualment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: pip install -r requirements.txt

      - name: Executa l'scraper
        run: python scraper.py

      - name: Puja el fitxer XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/tv3cat.xml
          git diff --staged --quiet || git commit -m "Actualització EPG $(date -u +'%Y-%m-%d %H:%M')"
          git push
